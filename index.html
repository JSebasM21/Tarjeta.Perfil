<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tarjeta de perfil de usuario - Ejercicio HTML y CSS"
    />
    <title>Tarjeta de Perfil - Jhon Moreno</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ⭐ MODIFICACIÓN 1: Agregué este div contenedor -->
    <div class="contenedor-principal">
      <!-- Tarjeta de perfil usando HTML5 semántico -->
      <article class="tarjeta-perfil">
        <!-- Imagen de perfil -->
        <img
          src="https://i.postimg.cc/ZY260rd1/Whats-App-Image-2025-11-28-at-5-57-56-PM.jpg"
          alt="Foto de perfil de jhon"
          class="perfil-imagen"
        />

        <!-- Información del usuario -->
        <h1 class="perfil-nombre">Jhon Moreno</h1>
        <p class="perfil-titulo">Desarrollador Frontend</p>
        <p class="perfil-descripcion">
          Apasionada por crear experiencias web modernas y accesibles.
          Especializada en HTML5, CSS3 y JavaScript.
        </p>

        <!-- Botón de acción -->
        <button class="btn-contactar">Contactar</button>
      </article>
      
      <!-- Nombre fuera de la tarjeta -->
      <footer class="nombre-externo">
        <h2>Jhon Moreno</h2>
      </footer>
    <!-- ⭐ MODIFICACIÓN 2: Cerré el div contenedor aquí -->
    </div>
